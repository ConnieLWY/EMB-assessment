services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ev_charger
      POSTGRES_USER: ev_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_app -d ev_charger"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://ev_app:${DB_PASSWORD:-local-dev-only}@db:5432/ev_charger?sslmode=disable", "up"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ev_app:${DB_PASSWORD:-local-dev-only}@db:5432/ev_charger?sslmode=disable
      HTTP_ADDR: :8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  test-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    profiles: ["test"]
    environment:
      POSTGRES_DB: ev_charger_test
      POSTGRES_USER: ev_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_test -d ev_charger_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
